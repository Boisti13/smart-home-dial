substitutions:
  # Folder of this project, relative to the ESPHome config folder. "." when
  # dial.yaml is the main file; Home Assistant's ESPHome app uses a small
  # top-level file that includes smart-home-dial/dial.yaml and sets this to
  # ./smart-home-dial (see docs/configuration.md#home-assistants-esphome-app).
  dial_dir: "."

packages:
  hardware:    !include src/main/hardware.yaml
  entities:    !include src/main/entities.yaml
  globals:     !include src/main/globals.yaml
  diagnostics: !include src/main/diagnostics.yaml
  power:       !include src/main/power.yaml
  load_page:   !include src/pages/load.yaml
  clock_page:  !include src/pages/main.yaml
  menu_page:   !include src/pages/menu.yaml
  light_page:  !include src/pages/light.yaml
  ha_lights_page: !include src/pages/ha_lights.yaml
  radiators_page: !include src/pages/radiators.yaml
  air_page:    !include src/pages/air.yaml
  timer_page:  !include src/pages/timer.yaml
  settings_page: !include src/pages/settings.yaml

esphome:
  name: m5stack-dialv1
  friendly_name: M5Stack Dial
  project:
    name: "smart-home-dial.firmware"
    version: "2.1.0"
  on_boot:
    - priority: 1000
      then:
        # Coming back from deep sleep, GPIO46 (power latch) and GPIO9
        # (backlight) are still held (src/main/power.yaml). Drive them first,
        # then release, so the latch never drops.
        - lambda: |-
            gpio_set_direction(GPIO_NUM_46, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_46, 1);
            gpio_hold_dis(GPIO_NUM_46);
            gpio_hold_dis(GPIO_NUM_9);
            id(woke_from_sleep) = (esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_EXT0);
    - priority: 800
      then:
        - switch.turn_on: power_hold
    - priority: -100
      then:
        - pcf8563.read_time:
        - light.turn_on:
            id: display_backlight
            brightness: 100%
        - lambda: |-
            lv_obj_set_style_anim_duration(id(slot_center_lbl), lv_anim_speed(id(scroll_anim_speed)), LV_PART_MAIN);
            lv_obj_set_style_anim_duration(id(lm_center_lbl), lv_anim_speed(id(scroll_anim_speed)), LV_PART_MAIN);
            lv_obj_set_style_anim_duration(id(sm_center_lbl), lv_anim_speed(id(scroll_anim_speed)), LV_PART_MAIN);
        - script.execute: update_loading_page
        # Woken by a touch: straight to the clock (the RTC has the time), with
        # the HA offline pill until Home Assistant is connected again.
        - if:
            condition:
              lambda: 'return id(woke_from_sleep) && !id(ha_connected);'
            then:
              - lvgl.widget.hide: loading_page
              - lvgl.widget.show: ha_offline_badge
              - lvgl.page.show: page_clock

esp32:
  board: m5stack-stamps3
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BROWNOUT_DET: "n"

logger:
  level: INFO   # DEBUG floods the log and costs CPU time on every LVGL update

api:
  encryption:
    key: !secret dial_api_key
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - script.execute: on_ha_connected
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - globals.set:
              id: ha_connected
              value: 'false'
          # Values on screen are now stale and buttons do nothing: say so.
          - lvgl.widget.show: ha_offline_badge

ota:
  - platform: esphome
    on_begin:
      - globals.set: {id: ota_running, value: 'true'}   # no deep sleep mid-update
    on_error:
      - globals.set: {id: ota_running, value: 'false'}
    # Uploads are encrypted with the API key (dial_api_key) and must be;
    # no separate OTA password.
    encryption: {}

wifi:
  power_save_mode: light   # radio sleeps between beacons; stays connected
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "M5Stack Dial Fallback"
    password: !secret ap_password

captive_portal:

globals:
  - id: ha_connected
    type: bool
    initial_value: 'false'

image:
  - platform: file
    file: ${dial_dir}/src/assets/images/logo.png
    id: logo_img
    type: RGB565
    transparency: alpha_channel
    resize: 72x72
  - platform: file
    file: ${dial_dir}/src/assets/images/scene.png
    id: img_scene
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - platform: file
    file: ${dial_dir}/src/assets/images/bulb.png
    id: img_light
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - platform: file
    file: ${dial_dir}/src/assets/images/ac.png
    id: img_ac
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - platform: file
    file: ${dial_dir}/src/assets/images/palette.png
    id: img_palette
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - platform: file
    file: ${dial_dir}/src/assets/images/brightness.png
    id: img_brightness
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - platform: file
    file: ${dial_dir}/src/assets/images/light.png
    id: img_dengguang
    type: RGB565
    transparency: alpha_channel
    resize: 24x24

color:
  - id: col_bg
    hex: "050812"
  - id: col_text_pri
    hex: "EEF2FF"
  - id: col_text_sec
    hex: "6B7FCC"

lvgl:
  displays:
    - round_display
  touchscreens:
    - touch
  encoders:
    - sensor: encoder
      enter_button: front_button
  buffer_size: "12%"
  color_depth: 16
  bg_color: col_bg
  default_font: font_lbl
