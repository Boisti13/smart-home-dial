  - file: "gfonts://DM+Sans"
    id: font_val
    size: 18
    bpp: 4
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .-%°/"

  - file: "gfonts://DM+Sans"
    id: font_val_s
    size: 15
    bpp: 4
