binary_sensor:
  - platform: gpio
    name: Button
    id: front_button
    pin:
      number: GPIO42
      inverted: true
      mode:
        input: true
        pullup: true
    on_multi_click:
      - timing:
          - ON for at most 500ms
          - OFF for at most 500ms
          - ON for at most 500ms
          - OFF for at least 40ms
        invalid_cooldown: 150ms
        then:
          - if:
              condition:
                lambda: 'return id(display_asleep) || millis() < id(wake_cooldown_until_ms);'
              then:
                - script.execute: wake_display
              else:
                - if:
                    condition:
                      lambda: 'return !id(button_debounce);'
                    then:
                      - globals.set: {id: button_debounce, value: 'true'}
                      - lambda: 'id(last_activity_ms) = millis();'
                      - script.execute: dial_back
                      - delay: 250ms
                      - globals.set: {id: button_debounce, value: 'false'}
      - timing:
          - ON for at most 420ms
          - OFF for at least 520ms
        invalid_cooldown: 150ms
        then:
          - if:
              condition:
                lambda: 'return id(display_asleep) || millis() < id(wake_cooldown_until_ms);'
              then:
                - script.execute: wake_display
              else:
                - if:
                    condition:
                      lambda: 'return !id(button_debounce);'
                    then:
                      - globals.set: {id: button_debounce, value: 'true'}
                      - lambda: |-
                          id(last_activity_ms) = millis();
                          if (id(in_menu)) {
                            id(menu_confirm).execute();
                          } else if (id(in_lights_menu)) {
                            id(lights_menu_confirm).execute();
                          } else if (id(in_radiators_menu)) {
                            id(radiators_menu_confirm).execute();
                          } else if (id(in_settings_menu)) {
                            id(settings_menu_confirm).execute();
                          } else if (id(in_motion_alert)) {
                            id(motion_alert_next_field).execute();
                          } else if (id(in_timer)) {
                            id(timer_toggle).execute();
                          }
                      - delay: 250ms
                      - globals.set: {id: button_debounce, value: 'false'}
  # M5Dial V1.1 uses GPIO46 as HOLD for battery power retention.
  # Keep this old back-button mapping commented; enabling it will conflict with
  # src/main/hardware.yaml:power_hold and battery-only boot will turn off again.
