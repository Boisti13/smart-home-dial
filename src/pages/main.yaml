color:
  - id: col_ring_track
    hex: "182033"    # restrained dark ring track
  - id: col_ring_progress
    hex: "5ECAD3"    # muted cyan progress
  - id: col_dot
    hex: "7FB8C2"    # soft minute dot
  - id: col_text_lbl
    hex: "8EA0B8"    # secondary labels
  - id: col_text_temp
    hex: "E8A35B"    # warm temperature accent
  - id: col_text_hum
    hex: "73B7D8"    # calm humidity accent
  - id: col_text_aqi
    hex: "7CCB9A"    # softened AQI accent
  - id: col_text_pres
    hex: "B7A7D9"    # muted pressure accent
  - id: col_text_wind
    hex: "D8C16A"    # restrained wind accent
  - id: col_divider
    hex: "202A3C"

time:
  - platform: pcf8563
    id: rtctime
    i2c_id: internal_i2c
    address: 0x51
    timezone: Asia/Shanghai
    update_interval: never
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - lvgl.label.update:
              id: lbl_clock
              text: !lambda |-
                static char buf[6];
                auto t = id(rtctime).now();
                sprintf(buf, "%02d:%02d", t.hour, t.minute);
                return buf;
          - lvgl.label.update:
              id: lbl_date
              text: !lambda |-
                static char buf[20];
                auto t = id(rtctime).now();
                const char* days[] = {"Sun","Mon","Tue","Wed","Thu","Fri","Sat"};
                const char* day = (t.day_of_week >= 1 && t.day_of_week <= 7) ? days[t.day_of_week - 1] : "---";
                sprintf(buf, "%s  %02d/%02d", day, t.month, t.day_of_month);
                return buf;
          - lvgl.arc.update:
              id: arc_minute
              value: !lambda "return id(rtctime).now().minute;"

  - platform: homeassistant
    id: esptime
    timezone: Asia/Shanghai
    on_time_sync:
      then:
        - pcf8563.write_time:

globals:
  - id: home_encoder_step_accum
    type: int
    initial_value: '0'
  - id: menu_scroll_encoder_accum
    type: int
    initial_value: '0'   # debounces carousel scrolling (Main/Lights/Radiators/Settings menus); they're mutually exclusive so one accumulator covers all of them

script:
  - id: dial_back
    then:
      - lambda: |-
          if (id(in_menu)) {
            id(close_menu).execute();
            return;
          }
          if (id(in_light) || id(in_colorpicker)) {
            id(close_light).execute();
            return;
          }
          if (id(in_ha_light)) {
            id(close_ha_light).execute();
            return;
          }
          if (id(in_lights_menu)) {
            id(close_lights_menu).execute();
            return;
          }
          if (id(in_radiator_room)) {
            id(close_radiator_room).execute();
            return;
          }
          if (id(in_radiators_menu)) {
            id(close_radiators_menu).execute();
            return;
          }
          if (id(in_display_timeout)) {
            id(close_display_timeout).execute();
            return;
          }
          if (id(in_menu_timeout)) {
            id(close_menu_timeout).execute();
            return;
          }
          if (id(in_dial_sensitivity)) {
            id(close_dial_sensitivity).execute();
            return;
          }
          if (id(in_buzzer_volume)) {
            id(close_buzzer_volume).execute();
            return;
          }
          if (id(in_motion_alert)) {
            id(close_motion_alert).execute();
            return;
          }
          if (id(in_settings_menu)) {
            id(close_settings_menu).execute();
            return;
          }
          if (id(in_air)) {
            id(close_air).execute();
            return;
          }
          if (id(in_music)) {
            id(in_music) = false;
            id(open_menu).execute();
            return;
          }
          if (id(in_timer)) {
            id(close_timer).execute();
            return;
          }
          // Fridge menu disabled; page kept in src/pages/fridge.yaml for reference.
          // if (id(in_fridge)) {
          //   id(in_fridge) = false;
          //   id(open_menu).execute();
          //   return;
          // }
          id(enter_menu).execute();

sensor:
  - platform: rotary_encoder
    id: encoder
    pin_a:
      number: GPIO40
      mode: INPUT_PULLUP
    pin_b:
      number: GPIO41
      mode: INPUT_PULLUP
    resolution: 4
    on_clockwise:
      - if:
          condition:
            lambda: 'return id(display_asleep) || millis() < id(wake_cooldown_until_ms);'
          then:
            - script.execute: wake_display
          else:
            - lambda: 'id(last_activity_ms) = millis();'
            - if:
                condition:
                  lambda: 'return id(in_colorpicker);'
                then:
                  - script.execute: light_hue_up
            - if:
                condition:
                  lambda: 'return id(in_light) && !id(in_colorpicker) && !id(in_menu);'
                then:
                  - script.execute: light_brightness_up
            - if:
                condition:
                  lambda: 'return id(in_air) && !id(in_menu);'
                then:
                  - lambda: |-
                      id(air_encoder_step_accum) += 1;
                      if (id(air_encoder_step_accum) >= id(encoder_step_threshold)) {
                        id(air_encoder_step_accum) = 0;
                        if (id(air_mode) == 0) {
                          id(air_temp_up).execute();
                        } else {
                          id(air_fan_up).execute();
                        }
                      }
            - if:
                condition:
                  lambda: 'return id(in_music);'
                then:
                  - script.execute: music_volume_up
            - if:
                condition:
                  lambda: 'return id(in_menu);'
                then:
                  - lambda: |-
                      id(menu_scroll_encoder_accum) += 1;
                      if (id(menu_scroll_encoder_accum) >= id(encoder_step_threshold)) {
                        id(menu_scroll_encoder_accum) = 0;
                        id(menu_scroll_down).execute();
                      }
            - if:
                condition:
                  lambda: 'return id(in_lights_menu);'
                then:
                  - lambda: |-
                      id(menu_scroll_encoder_accum) += 1;
                      if (id(menu_scroll_encoder_accum) >= id(encoder_step_threshold)) {
                        id(menu_scroll_encoder_accum) = 0;
                        id(lights_menu_scroll_down).execute();
                      }
            - if:
                condition:
                  lambda: 'return id(in_ha_light);'
                then:
                  - script.execute: ha_light_brightness_up
            - if:
                condition:
                  lambda: 'return id(in_radiators_menu);'
                then:
                  - lambda: |-
                      id(menu_scroll_encoder_accum) += 1;
                      if (id(menu_scroll_encoder_accum) >= id(encoder_step_threshold)) {
                        id(menu_scroll_encoder_accum) = 0;
                        id(radiators_menu_scroll_down).execute();
                      }
            - if:
                condition:
                  lambda: 'return id(in_radiator_room);'
                then:
                  - script.execute: radiator_temp_up
            - if:
                condition:
                  lambda: 'return id(in_display_timeout);'
                then:
                  - lambda: |-
                      id(display_timeout_encoder_accum) += 1;
                      if (id(display_timeout_encoder_accum) >= id(encoder_step_threshold)) {
                        id(display_timeout_encoder_accum) = 0;
                        id(display_timeout_up).execute();
                      }
            - if:
                condition:
                  lambda: 'return id(in_menu_timeout);'
                then:
                  - lambda: |-
                      id(menu_timeout_encoder_accum) += 1;
                      if (id(menu_timeout_encoder_accum) >= id(encoder_step_threshold)) {
                        id(menu_timeout_encoder_accum) = 0;
                        id(menu_timeout_up).execute();
                      }
            - if:
                condition:
                  lambda: 'return id(in_dial_sensitivity);'
                then:
                  - lambda: |-
                      id(dial_sensitivity_encoder_accum) += 1;
                      if (id(dial_sensitivity_encoder_accum) >= id(encoder_step_threshold)) {
                        id(dial_sensitivity_encoder_accum) = 0;
                        id(dial_sensitivity_up).execute();
                      }
            - if:
                condition:
                  lambda: 'return id(in_buzzer_volume);'
                then:
                  - script.execute: buzzer_volume_up
            - if:
                condition:
                  lambda: 'return id(in_motion_alert);'
                then:
                  - lambda: |-
                      id(motion_alert_encoder_accum) += 1;
                      if (id(motion_alert_encoder_accum) >= id(encoder_step_threshold)) {
                        id(motion_alert_encoder_accum) = 0;
                        id(motion_alert_up).execute();
                      }
            - if:
                condition:
                  lambda: 'return id(in_settings_menu);'
                then:
                  - lambda: |-
                      id(menu_scroll_encoder_accum) += 1;
                      if (id(menu_scroll_encoder_accum) >= id(encoder_step_threshold)) {
                        id(menu_scroll_encoder_accum) = 0;
                        id(settings_menu_scroll_down).execute();
                      }
            # Fridge menu disabled; page kept in src/pages/fridge.yaml for reference.
            # - if:
            #     condition:
            #       lambda: 'return id(in_fridge);'
            #     then:
            #       - script.execute: fridge_scroll_down
            - if:
                condition:
                  lambda: 'return id(in_timer);'
                then:
                  - script.execute: dismiss_timer_alarm
                  - script.execute: timer_encoder_up
            - if:
                condition:
                  lambda: |-
                    return !id(in_menu) && !id(in_light) && !id(in_colorpicker) && !id(in_air) &&
                           !id(in_music) && !id(in_lights_menu) && !id(in_ha_light) &&
                           !id(in_radiators_menu) && !id(in_radiator_room) &&
                           !id(in_display_timeout) && !id(in_settings_menu) && !id(in_menu_timeout) &&
                           !id(in_dial_sensitivity) &&
                           !id(in_buzzer_volume) && !id(in_motion_alert) &&
                           !id(in_timer);
                then:
                  - lambda: |-
                      int v = id(home_encoder_step_accum) + 1;
                      if (v > 1) {
                        id(home_encoder_step_accum) = 0;
                        id(enter_menu).execute();
                      } else {
                        id(home_encoder_step_accum) = v;
                      }
    on_anticlockwise:
      - if:
          condition:
            lambda: 'return id(display_asleep) || millis() < id(wake_cooldown_until_ms);'
          then:
            - script.execute: wake_display
          else:
            - lambda: 'id(last_activity_ms) = millis();'
            - if:
                condition:
                  lambda: 'return id(in_colorpicker);'
                then:
                  - script.execute: light_hue_down
            - if:
                condition:
                  lambda: 'return id(in_light) && !id(in_colorpicker) && !id(in_menu);'
                then:
                  - script.execute: light_brightness_down
            - if:
                condition:
                  lambda: 'return id(in_air) && !id(in_menu);'
                then:
                  - lambda: |-
                      id(air_encoder_step_accum) -= 1;
                      if (id(air_encoder_step_accum) <= -id(encoder_step_threshold)) {
                        id(air_encoder_step_accum) = 0;
                        if (id(air_mode) == 0) {
                          id(air_temp_down).execute();
                        } else {
                          id(air_fan_down).execute();
                        }
                      }
            - if:
                condition:
                  lambda: 'return id(in_music);'
                then:
                  - script.execute: music_volume_down
            - if:
                condition:
                  lambda: 'return id(in_menu);'
                then:
                  - lambda: |-
                      id(menu_scroll_encoder_accum) -= 1;
                      if (id(menu_scroll_encoder_accum) <= -id(encoder_step_threshold)) {
                        id(menu_scroll_encoder_accum) = 0;
                        id(menu_scroll_up).execute();
                      }
            - if:
                condition:
                  lambda: 'return id(in_lights_menu);'
                then:
                  - lambda: |-
                      id(menu_scroll_encoder_accum) -= 1;
                      if (id(menu_scroll_encoder_accum) <= -id(encoder_step_threshold)) {
                        id(menu_scroll_encoder_accum) = 0;
                        id(lights_menu_scroll_up).execute();
                      }
            - if:
                condition:
                  lambda: 'return id(in_ha_light);'
                then:
                  - script.execute: ha_light_brightness_down
            - if:
                condition:
                  lambda: 'return id(in_radiators_menu);'
                then:
                  - lambda: |-
                      id(menu_scroll_encoder_accum) -= 1;
                      if (id(menu_scroll_encoder_accum) <= -id(encoder_step_threshold)) {
                        id(menu_scroll_encoder_accum) = 0;
                        id(radiators_menu_scroll_up).execute();
                      }
            - if:
                condition:
                  lambda: 'return id(in_radiator_room);'
                then:
                  - script.execute: radiator_temp_down
            - if:
                condition:
                  lambda: 'return id(in_display_timeout);'
                then:
                  - lambda: |-
                      id(display_timeout_encoder_accum) -= 1;
                      if (id(display_timeout_encoder_accum) <= -id(encoder_step_threshold)) {
                        id(display_timeout_encoder_accum) = 0;
                        id(display_timeout_down).execute();
                      }
            - if:
                condition:
                  lambda: 'return id(in_menu_timeout);'
                then:
                  - lambda: |-
                      id(menu_timeout_encoder_accum) -= 1;
                      if (id(menu_timeout_encoder_accum) <= -id(encoder_step_threshold)) {
                        id(menu_timeout_encoder_accum) = 0;
                        id(menu_timeout_down).execute();
                      }
            - if:
                condition:
                  lambda: 'return id(in_dial_sensitivity);'
                then:
                  - lambda: |-
                      id(dial_sensitivity_encoder_accum) -= 1;
                      if (id(dial_sensitivity_encoder_accum) <= -id(encoder_step_threshold)) {
                        id(dial_sensitivity_encoder_accum) = 0;
                        id(dial_sensitivity_down).execute();
                      }
            - if:
                condition:
                  lambda: 'return id(in_buzzer_volume);'
                then:
                  - script.execute: buzzer_volume_down
            - if:
                condition:
                  lambda: 'return id(in_motion_alert);'
                then:
                  - lambda: |-
                      id(motion_alert_encoder_accum) -= 1;
                      if (id(motion_alert_encoder_accum) <= -id(encoder_step_threshold)) {
                        id(motion_alert_encoder_accum) = 0;
                        id(motion_alert_down).execute();
                      }
            - if:
                condition:
                  lambda: 'return id(in_settings_menu);'
                then:
                  - lambda: |-
                      id(menu_scroll_encoder_accum) -= 1;
                      if (id(menu_scroll_encoder_accum) <= -id(encoder_step_threshold)) {
                        id(menu_scroll_encoder_accum) = 0;
                        id(settings_menu_scroll_up).execute();
                      }
            # Fridge menu disabled; page kept in src/pages/fridge.yaml for reference.
            # - if:
            #     condition:
            #       lambda: 'return id(in_fridge);'
            #     then:
            #       - script.execute: fridge_scroll_up
            - if:
                condition:
                  lambda: 'return id(in_timer);'
                then:
                  - script.execute: dismiss_timer_alarm
                  - script.execute: timer_encoder_down
            - if:
                condition:
                  lambda: |-
                    return !id(in_menu) && !id(in_light) && !id(in_colorpicker) && !id(in_air) &&
                           !id(in_music) && !id(in_lights_menu) && !id(in_ha_light) &&
                           !id(in_radiators_menu) && !id(in_radiator_room) &&
                           !id(in_display_timeout) && !id(in_settings_menu) && !id(in_menu_timeout) &&
                           !id(in_dial_sensitivity) &&
                           !id(in_buzzer_volume) && !id(in_motion_alert) &&
                           !id(in_timer);
                then:
                  - lambda: |-
                      int v = id(home_encoder_step_accum) - 1;
                      if (v < -1) {
                        id(home_encoder_step_accum) = 0;
                        id(enter_menu).execute();
                      } else {
                        id(home_encoder_step_accum) = v;
                      }

