image:
  - platform: file
    file: ${dial_dir}/src/assets/images/speaker.png
    id: menu_img_speaker
    type: RGB565
    transparency: alpha_channel
    resize: 34x34

  - platform: file
    file: ${dial_dir}/src/assets/images/motion_alert.png
    id: menu_img_motion_alert
    type: RGB565
    transparency: alpha_channel
    resize: 34x34

globals:
  - id: in_settings_menu
    type: bool
    initial_value: 'false'
  - id: settings_menu_sel
    type: int
    initial_value: '0'
  - id: settings_menu_animating
    type: bool
    initial_value: 'false'
  - id: in_display_timeout
    type: bool
    initial_value: 'false'
  - id: display_timeout_encoder_accum
    type: int
    initial_value: '0'   # debounces the encoder so one physical click = one step change
  - id: in_menu_timeout
    type: bool
    initial_value: 'false'
  - id: menu_timeout_encoder_accum
    type: int
    initial_value: '0'   # debounces the encoder so one physical click = one step change
  - id: in_dial_sensitivity
    type: bool
    initial_value: 'false'
  - id: dial_sensitivity_encoder_accum
    type: int
    initial_value: '0'   # debounces the encoder so one physical click = one step change
  - id: in_buzzer_volume
    type: bool
    initial_value: 'false'
  - id: in_motion_alert
    type: bool
    initial_value: 'false'
  - id: motion_alert_field
    type: int
    initial_value: '0'   # which row is focused on the Motion Alert page: 0=enabled, 1=duration, 2=cooldown
  - id: motion_alert_encoder_accum
    type: int
    initial_value: '0'   # debounces the encoder so one physical click = one step change
  - id: in_menu_items
    type: bool
    initial_value: 'false'
  - id: menu_items_field
    type: int
    initial_value: '0'   # which row is focused on the Menu Items page: 0=Timer ... 4=Music
  - id: menu_items_encoder_accum
    type: int
    initial_value: '0'   # debounces the encoder so one physical click = one step change
  - id: motion_alarm_active
    type: bool
    initial_value: 'false'
  - id: motion_alarm_start_ms
    type: uint32_t
    initial_value: '0'
  - id: motion_alarm_last_trigger_ms
    type: uint32_t
    initial_value: '0'
  - id: motion_alarm_blink
    type: bool
    initial_value: 'false'
  - id: display_asleep
    type: bool
    initial_value: 'false'
  - id: last_activity_ms
    type: uint32_t
    initial_value: '0'
  - id: touch_woke_display
    type: bool
    initial_value: 'false'
  - id: wake_cooldown_until_ms
    type: uint32_t
    initial_value: '0'

interval:
  - interval: 1s
    then:
      - lambda: |-
          bool alert_busy = id(in_timer) && (id(timer_running) || id(timer_alarm_active));
          alert_busy = alert_busy || id(motion_alarm_active);
          if (!alert_busy && !id(display_asleep)) {
            uint32_t elapsed = millis() - id(last_activity_ms);
            uint32_t display_timeout_ms = (uint32_t)id(display_timeout_s) * 1000;
            if (elapsed >= display_timeout_ms) {
              id(sleep_display).execute();
            }
          }
      - lambda: |-
          bool timer_busy = id(in_timer) && (id(timer_running) || id(timer_alarm_active));
          bool on_clock = timer_busy || (!id(in_menu) && !id(in_light) && !id(in_colorpicker) && !id(in_air) &&
                          !id(in_music) && !id(in_lights_menu) && !id(in_ha_light) &&
                          !id(in_radiators_menu) && !id(in_radiator_room) &&
                          !id(in_display_timeout) && !id(in_settings_menu) && !id(in_menu_timeout) &&
                          !id(in_dial_sensitivity) &&
                          !id(in_buzzer_volume) && !id(in_motion_alert) && !id(in_menu_items) &&
                          !id(in_timer));
          if (!on_clock) {
            uint32_t elapsed = millis() - id(last_activity_ms);
            uint32_t menu_timeout_ms = (uint32_t)id(menu_timeout_s) * 1000;
            if (elapsed >= menu_timeout_ms) {
              id(force_return_home).execute();
            }
          }
      - lambda: |-
          if (id(motion_alarm_active)) {
            uint32_t duration_ms = (uint32_t)id(motion_alarm_duration_s) * 1000;
            if (millis() - id(motion_alarm_start_ms) >= duration_ms) {
              id(stop_motion_alarm).execute();
            } else if (!id(buzzer_rtttl).is_playing()) {
              id(buzzer_rtttl).play("alarm:d=8,o=6,b=200:c,c,p,c,c");
            }
          }

  - interval: 500ms
    then:
      - lambda: |-
          if (id(motion_alarm_active)) {
            id(motion_alarm_blink) = !id(motion_alarm_blink);
            if (id(motion_alarm_blink)) {
              lv_obj_fade_in(id(motion_alarm_overlay), 150, 0);
            } else {
              lv_obj_fade_out(id(motion_alarm_overlay), 150, 0);
            }
          }

binary_sensor:
  - platform: homeassistant
    id: ha_motion_alarm
    entity_id: ${motion_alarm_entity}
    on_state:
      - lambda: |-
          uint32_t cooldown_ms = (uint32_t)id(motion_alarm_cooldown_s) * 1000;
          bool cooled_down = millis() - id(motion_alarm_last_trigger_ms) >= cooldown_ms;
          if (x && id(motion_alert_enabled) && id(buzzer_enabled) && cooled_down) {
            id(start_motion_alarm).execute();
          }

script:
  - id: sleep_display
    then:
      - light.turn_off: display_backlight
      - globals.set: {id: display_asleep, value: 'true'}
      - globals.set: {id: home_encoder_step_accum, value: '0'}
      - lambda: 'lv_obj_clear_flag(id(sleep_overlay), LV_OBJ_FLAG_HIDDEN);'

  - id: wake_display
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - globals.set: {id: display_asleep, value: 'false'}
      - globals.set: {id: home_encoder_step_accum, value: '0'}
      - lambda: |-
          id(last_activity_ms) = millis();
          id(wake_cooldown_until_ms) = millis() + 400;
          lv_obj_add_flag(id(sleep_overlay), LV_OBJ_FLAG_HIDDEN);

  - id: force_return_home
    then:
      - globals.set: {id: in_menu, value: 'false'}
      - globals.set: {id: in_light, value: 'false'}
      - globals.set: {id: in_colorpicker, value: 'false'}
      - globals.set: {id: in_air, value: 'false'}
      - globals.set: {id: in_music, value: 'false'}
      - globals.set: {id: in_timer, value: 'false'}
      # Fridge menu disabled; page kept in src/pages/fridge.yaml for reference.
      # - globals.set: {id: in_fridge, value: 'false'}
      - globals.set: {id: in_lights_menu, value: 'false'}
      - globals.set: {id: in_ha_light, value: 'false'}
      - globals.set: {id: in_radiators_menu, value: 'false'}
      - globals.set: {id: in_radiator_room, value: 'false'}
      - globals.set: {id: in_settings_menu, value: 'false'}
      - globals.set: {id: in_display_timeout, value: 'false'}
      - globals.set: {id: in_menu_timeout, value: 'false'}
      - globals.set: {id: in_dial_sensitivity, value: 'false'}
      - globals.set: {id: in_buzzer_volume, value: 'false'}
      - globals.set: {id: in_motion_alert, value: 'false'}
      - globals.set: {id: in_menu_items, value: 'false'}
      - lambda: 'id(last_activity_ms) = millis();'
      - lvgl.page.show:
          id: page_clock
          animation: MOVE_RIGHT

  - id: open_settings_menu
    then:
      - globals.set: {id: in_settings_menu, value: 'true'}
      - globals.set: {id: in_menu, value: 'false'}
      - globals.set: {id: menu_scroll_encoder_accum, value: '0'}
      - script.execute: refresh_settings_menu
      - lvgl.page.show:
          id: page_settings_menu
          animation: MOVE_LEFT

  - id: enter_settings_menu
    then:
      - globals.set: {id: settings_menu_sel, value: '0'}
      - script.execute: open_settings_menu

  - id: close_settings_menu
    then:
      - globals.set: {id: in_settings_menu, value: 'false'}
      - script.execute: open_menu

  - id: settings_menu_scroll_up
    then:
      - if:
          condition:
            lambda: 'return !id(settings_menu_animating);'
          then:
            - globals.set: {id: settings_menu_animating, value: 'true'}
            - lambda: |-
                static lv_anim_t a;
                lv_anim_init(&a);
                lv_anim_set_var(&a, nullptr);
                lv_anim_set_values(&a, 0, 100);
                lv_anim_set_time(&a, 200);
                lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
                lv_anim_set_exec_cb(&a, [](void * obj, int32_t progress) {
                  const int SLOT_N = 5;
                  const int OFFSETS[5] = {-2, -1, 0, 1, 2};
                  const float CY = 120.0f;
                  const float ARC_CX = 162.0f;
                  const float R = 98.0f;
                  auto arc_dy = [](float off) -> float {
                    const float s = (off >= 0.0f) ? 1.0f : -1.0f;
                    const float a = fabsf(off);
                    return s * (a <= 1.0f ? a * 60.0f : 60.0f + (a - 1.0f) * 36.0f);
                  };

                  lv_obj_t* slots[5] = {
                    id(sm_far_up), id(sm_near_up), id(sm_center),
                    id(sm_near_dn), id(sm_far_dn)
                  };
                  lv_obj_t* icons[5] = {
                    id(sm_far_up_img), id(sm_near_up_img), id(sm_center_img),
                    id(sm_near_dn_img), id(sm_far_dn_img)
                  };
                  lv_obj_t* title_lbls[5] = {
                    id(sm_far_up_lbl), id(sm_near_up_lbl), id(sm_center_lbl),
                    id(sm_near_dn_lbl), id(sm_far_dn_lbl)
                  };

                  const float phase = progress / 100.0f;
                  int center_sub_opa = 0;

                  for (int i = 0; i < SLOT_N; i++) {
                    const float off = OFFSETS[i] + phase;
                    float dy = arc_dy(off);
                    if (dy > R) dy = R;
                    if (dy < -R) dy = -R;

                    const float theta = asinf(dy / R);
                    const float x = ARC_CX - R * cosf(theta);
                    const float y = CY + R * sinf(theta);

                    float closeness = 1.0f - (fabsf(off) / 2.0f);
                    if (closeness < 0.0f) closeness = 0.0f;
                    if (closeness > 1.0f) closeness = 1.0f;

                    const int mix = (int)(closeness * 1000.0f);
                    int w = 40;
                    int opa_text = 0;
                    int opa_bg = 0;
                    int pill_shift = 0;

                    if (mix > 760) w = lv_map(mix, 760, 1000, 40, 200);
                    if (mix > 840) opa_text = lv_map(mix, 840, 1000, 0, 255);
                    if (mix > 820) opa_bg = lv_map(mix, 820, 1000, 0, 255);
                    if (mix > 760) pill_shift = lv_map(mix, 760, 1000, 0, 54);
                    const int opa_icon = lv_map(mix, 0, 1000, 96, 255);

                    lv_obj_set_width(slots[i], w);
                    lv_obj_set_height(slots[i], i == 2 ? 56 : 40);
                    lv_obj_set_style_radius(slots[i], i == 2 ? 28 : 20, LV_PART_MAIN);
                    lv_obj_set_style_bg_color(slots[i], lv_color_hex(0x0D1537), LV_PART_MAIN);
                    lv_obj_set_style_bg_opa(slots[i], opa_bg, LV_PART_MAIN);

                    lv_obj_set_pos(slots[i], (int)(x - 14.0f - 120.0f + pill_shift), (int)(y - (i == 2 ? 28.0f : 20.0f)));

                    lv_obj_set_style_opa(icons[i], opa_icon, LV_PART_MAIN);
                    lv_obj_set_style_opa(title_lbls[i], opa_text, LV_PART_MAIN);

                    if (i == 2) {
                      center_sub_opa = opa_text;
                    }
                  }

                  lv_obj_set_style_opa(id(sm_center_sub), center_sub_opa, LV_PART_MAIN);
                });
                lv_anim_set_ready_cb(&a, [](lv_anim_t * anim) {
                  int n = 6;
                  id(settings_menu_sel) = ((id(settings_menu_sel) - 1) % n + n) % n;
                  id(refresh_settings_menu).execute();
                  id(settings_menu_animating) = false;
                });
                lv_anim_start(&a);

  - id: settings_menu_scroll_down
    then:
      - if:
          condition:
            lambda: 'return !id(settings_menu_animating);'
          then:
            - globals.set: {id: settings_menu_animating, value: 'true'}
            - lambda: |-
                static lv_anim_t a;
                lv_anim_init(&a);
                lv_anim_set_var(&a, nullptr);
                lv_anim_set_values(&a, 0, 100);
                lv_anim_set_time(&a, 200);
                lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
                lv_anim_set_exec_cb(&a, [](void * obj, int32_t progress) {
                  const int SLOT_N = 5;
                  const int OFFSETS[5] = {-2, -1, 0, 1, 2};
                  const float CY = 120.0f;
                  const float ARC_CX = 162.0f;
                  const float R = 98.0f;
                  auto arc_dy = [](float off) -> float {
                    const float s = (off >= 0.0f) ? 1.0f : -1.0f;
                    const float a = fabsf(off);
                    return s * (a <= 1.0f ? a * 60.0f : 60.0f + (a - 1.0f) * 36.0f);
                  };

                  lv_obj_t* slots[5] = {
                    id(sm_far_up), id(sm_near_up), id(sm_center),
                    id(sm_near_dn), id(sm_far_dn)
                  };
                  lv_obj_t* icons[5] = {
                    id(sm_far_up_img), id(sm_near_up_img), id(sm_center_img),
                    id(sm_near_dn_img), id(sm_far_dn_img)
                  };
                  lv_obj_t* title_lbls[5] = {
                    id(sm_far_up_lbl), id(sm_near_up_lbl), id(sm_center_lbl),
                    id(sm_near_dn_lbl), id(sm_far_dn_lbl)
                  };

                  const float phase = progress / 100.0f;
                  int center_sub_opa = 0;

                  for (int i = 0; i < SLOT_N; i++) {
                    const float off = OFFSETS[i] - phase;
                    float dy = arc_dy(off);
                    if (dy > R) dy = R;
                    if (dy < -R) dy = -R;

                    const float theta = asinf(dy / R);
                    const float x = ARC_CX - R * cosf(theta);
                    const float y = CY + R * sinf(theta);

                    float closeness = 1.0f - (fabsf(off) / 2.0f);
                    if (closeness < 0.0f) closeness = 0.0f;
                    if (closeness > 1.0f) closeness = 1.0f;

                    const int mix = (int)(closeness * 1000.0f);
                    int w = 40;
                    int opa_text = 0;
                    int opa_bg = 0;
                    int pill_shift = 0;

                    if (mix > 760) w = lv_map(mix, 760, 1000, 40, 200);
                    if (mix > 840) opa_text = lv_map(mix, 840, 1000, 0, 255);
                    if (mix > 820) opa_bg = lv_map(mix, 820, 1000, 0, 255);
                    if (mix > 760) pill_shift = lv_map(mix, 760, 1000, 0, 64);
                    const int opa_icon = lv_map(mix, 0, 1000, 96, 255);

                    lv_obj_set_width(slots[i], w);
                    lv_obj_set_height(slots[i], i == 2 ? 56 : 40);
                    lv_obj_set_style_radius(slots[i], i == 2 ? 28 : 20, LV_PART_MAIN);
                    lv_obj_set_style_bg_color(slots[i], lv_color_hex(0x0D1537), LV_PART_MAIN);
                    lv_obj_set_style_bg_opa(slots[i], opa_bg, LV_PART_MAIN);

                    lv_obj_set_pos(slots[i], (int)(x - 14.0f - 120.0f + pill_shift), (int)(y - (i == 2 ? 28.0f : 20.0f)));

                    lv_obj_set_style_opa(icons[i], opa_icon, LV_PART_MAIN);
                    lv_obj_set_style_opa(title_lbls[i], opa_text, LV_PART_MAIN);

                    if (i == 2) {
                      center_sub_opa = opa_text;
                    }
                  }

                  lv_obj_set_style_opa(id(sm_center_sub), center_sub_opa, LV_PART_MAIN);
                });
                lv_anim_set_ready_cb(&a, [](lv_anim_t * anim) {
                  id(settings_menu_sel) = (id(settings_menu_sel) + 1) % 6;
                  id(refresh_settings_menu).execute();
                  id(settings_menu_animating) = false;
                });
                lv_anim_start(&a);

  - id: settings_menu_confirm
    then:
      - lambda: |-
          int sel = id(settings_menu_sel);
          id(in_settings_menu) = false;
          if (sel == 0) { id(open_display_timeout).execute(); }
          else if (sel == 1) { id(open_menu_timeout).execute(); }
          else if (sel == 2) { id(open_buzzer_volume).execute(); }
          else if (sel == 3) { id(open_motion_alert).execute(); }
          else if (sel == 4) { id(open_dial_sensitivity).execute(); }
          else { id(open_menu_items).execute(); }

  - id: refresh_settings_menu
    then:
      - lambda: |-
          const int ITEM_N = 6;
          const int SLOT_N = 5;
          const float CY = 120.0f;
          const float ARC_CX = 162.0f;
          const float R = 98.0f;
          auto arc_dy = [](float off) -> float {
            const float s = (off >= 0.0f) ? 1.0f : -1.0f;
            const float a = fabsf(off);
            return s * (a <= 1.0f ? a * 60.0f : 60.0f + (a - 1.0f) * 36.0f);
          };
          const int OFFSETS[5] = {-2, -1, 0, 1, 2};

          static char sub_display[16];
          static char sub_menu[16];
          snprintf(sub_display, sizeof(sub_display), "%ds", id(display_timeout_s));
          snprintf(sub_menu, sizeof(sub_menu), "%ds", id(menu_timeout_s));
          const char* sub_buzzer = id(buzzer_enabled) ? "On" : "Off";
          const char* sub_motion = id(motion_alert_enabled) ? "On" : "Off";
          static char sub_sensitivity[16];
          snprintf(sub_sensitivity, sizeof(sub_sensitivity), "%d", id(encoder_step_threshold));
          static char sub_items[16];
          int items_on = id(menu_show_timer).state + id(menu_show_lights).state + id(menu_show_radiators).state +
                         id(menu_show_ac).state + id(menu_show_music).state;
          snprintf(sub_items, sizeof(sub_items), "%d of 5 shown", items_on);

          const char* TITLES[6] = {"Display Timeout", "Menu Timeout", "Buzzer", "Motion Alert", "Dial Sensitivity", "Menu Items"};
          const char* SUBTITLES[6] = {sub_display, sub_menu, sub_buzzer, sub_motion, sub_sensitivity, sub_items};
          const uint32_t ACCENT_COLORS[6] = {0x9CA3AF, 0x38BDF8, 0x4ADE80, 0xF87171, 0x38BDF8, 0x576BFE};
          const uint32_t PILL_COLORS[6] = {0x1E2024, 0x0F1E2A, 0x0A2A14, 0x2A1414, 0x0F1E2A, 0x0D1537};
          const lv_img_dsc_t* IMGS[6] = {
            id(menu_img_timer)->get_lv_image_dsc(),
            id(menu_img_timer)->get_lv_image_dsc(),
            id(menu_img_speaker)->get_lv_image_dsc(),
            id(menu_img_motion_alert)->get_lv_image_dsc(),
            id(menu_img_timer)->get_lv_image_dsc(),
            id(menu_img_home)->get_lv_image_dsc()
          };

          int sel = id(settings_menu_sel);

          lv_obj_t* slots[5] = {
            id(sm_far_up), id(sm_near_up), id(sm_center), id(sm_near_dn), id(sm_far_dn)
          };
          lv_obj_t* lbls[5] = {
            id(sm_far_up_lbl), id(sm_near_up_lbl), id(sm_center_lbl), id(sm_near_dn_lbl), id(sm_far_dn_lbl)
          };
          lv_obj_t* icons[5] = {
            id(sm_far_up_img), id(sm_near_up_img), id(sm_center_img), id(sm_near_dn_img), id(sm_far_dn_img)
          };

          for (int slot = 0; slot < SLOT_N; slot++) {
            int di = ((sel + OFFSETS[slot]) % ITEM_N + ITEM_N) % ITEM_N;

            const float off = OFFSETS[slot];
            float dy = arc_dy(off);
            if (dy > R) dy = R;
            if (dy < -R) dy = -R;

            const float theta = asinf(dy / R);
            const float x = ARC_CX - R * cosf(theta);
            const float y = CY + R * sinf(theta);

            float closeness = 1.0f - (fabsf(off) / 2.0f);
            if (closeness < 0.0f) closeness = 0.0f;
            if (closeness > 1.0f) closeness = 1.0f;
            const int mix = (int)(closeness * 1000.0f);

            int w = 40;
            int opa_text = 0;
            int opa_bg = 0;
            int pill_shift = 0;
            if (mix > 760) w = lv_map(mix, 760, 1000, 40, 200);
            if (mix > 840) opa_text = lv_map(mix, 840, 1000, 0, 255);
            if (mix > 820) opa_bg = lv_map(mix, 820, 1000, 0, 255);
            if (mix > 760) pill_shift = lv_map(mix, 760, 1000, 0, 54);
            const int opa_icon = lv_map(mix, 0, 1000, 96, 255);

            lv_obj_set_width(slots[slot], w);
            lv_obj_set_height(slots[slot], slot == 2 ? 56 : 40);
            lv_obj_set_style_radius(slots[slot], slot == 2 ? 28 : 20, LV_PART_MAIN);

            if (slot == 2) {
              lv_obj_set_style_bg_color(slots[slot], lv_color_hex(PILL_COLORS[di]), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(slots[slot], 128, LV_PART_MAIN);
              lv_obj_set_style_border_color(slots[slot], lv_color_hex(ACCENT_COLORS[di]), LV_PART_MAIN);
              lv_obj_set_style_border_width(slots[slot], 2, LV_PART_MAIN);
              lv_obj_set_style_border_opa(slots[slot], 255, LV_PART_MAIN);
            } else {
              lv_obj_set_style_bg_color(slots[slot], lv_color_hex(0x0D1537), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(slots[slot], opa_bg, LV_PART_MAIN);
              lv_obj_set_style_border_width(slots[slot], 0, LV_PART_MAIN);
            }

            lv_obj_set_pos(slots[slot], (int)(x - 14.0f - 120.0f + pill_shift), (int)(y - (slot == 2 ? 28.0f : 20.0f)));

            lv_label_set_text(lbls[slot], TITLES[di]);
            if (slot == 2) {
              lv_obj_set_style_text_color(lbls[slot], lv_color_hex(ACCENT_COLORS[di]), LV_PART_MAIN);
            } else {
              lv_obj_set_style_text_color(lbls[slot], lv_color_hex(0x232A38), LV_PART_MAIN);
            }
            lv_obj_set_style_opa(lbls[slot], slot == 2 ? 255 : opa_text, LV_PART_MAIN);
            lv_img_set_src(icons[slot], IMGS[di]);
            lv_obj_set_style_opa(icons[slot], slot == 2 ? 255 : opa_icon, LV_PART_MAIN);

            if (slot == 2) {
              lv_label_set_text(id(sm_center_sub), SUBTITLES[di]);
              lv_obj_set_style_text_color(id(sm_center_sub), lv_color_hex(ACCENT_COLORS[di]), LV_PART_MAIN);
              lv_obj_set_style_opa(id(sm_center_sub), 255, LV_PART_MAIN);
            }
          }

          lv_obj_t* sdots[6] = {id(sm_sdot_0), id(sm_sdot_1), id(sm_sdot_2), id(sm_sdot_3), id(sm_sdot_4), id(sm_sdot_5)};
          for (int d = 0; d < ITEM_N; d++) {
            if (d == sel) {
              lv_obj_set_style_bg_color(sdots[d], lv_color_hex(ACCENT_COLORS[d]), LV_PART_MAIN);
              lv_obj_set_style_opa(sdots[d], 255, LV_PART_MAIN);
              lv_obj_set_size(sdots[d], 8, 8);
              lv_obj_set_style_radius(sdots[d], 0, LV_PART_MAIN);
              lv_obj_set_style_transform_angle(sdots[d], 450, LV_PART_MAIN);
            } else {
              lv_obj_set_style_bg_color(sdots[d], lv_color_hex(0x2A3348), LV_PART_MAIN);
              lv_obj_set_style_opa(sdots[d], 180, LV_PART_MAIN);
              lv_obj_set_size(sdots[d], 4, 4);
              lv_obj_set_style_radius(sdots[d], 2, LV_PART_MAIN);
              lv_obj_set_style_transform_angle(sdots[d], 0, LV_PART_MAIN);
            }
          }

          lv_obj_set_style_border_width(id(sm_center), 0, LV_PART_MAIN);

  - id: open_display_timeout
    then:
      - globals.set: {id: in_display_timeout, value: 'true'}
      - globals.set: {id: display_timeout_encoder_accum, value: '0'}
      - script.execute: refresh_display_timeout
      - lvgl.page.show:
          id: page_display_timeout
          animation: MOVE_LEFT

  - id: close_display_timeout
    then:
      - globals.set: {id: in_display_timeout, value: 'false'}
      - script.execute: open_settings_menu

  - id: display_timeout_up
    then:
      - lambda: |-
          int v = id(display_timeout_s) + 5;
          if (v > 300) v = 300;
          id(display_timeout_s) = v;
      - script.execute: refresh_display_timeout

  - id: display_timeout_down
    then:
      - lambda: |-
          int v = id(display_timeout_s) - 5;
          if (v < 5) v = 5;
          id(display_timeout_s) = v;
      - script.execute: refresh_display_timeout

  - id: refresh_display_timeout
    then:
      - lambda: |-
          static char buf[8];
          snprintf(buf, sizeof(buf), "%d", id(display_timeout_s));
          lv_label_set_text(id(lbl_display_timeout_val), buf);
      - script.execute: refresh_settings_menu

  - id: open_dial_sensitivity
    then:
      - globals.set: {id: in_dial_sensitivity, value: 'true'}
      - globals.set: {id: dial_sensitivity_encoder_accum, value: '0'}
      - script.execute: refresh_dial_sensitivity
      - lvgl.page.show:
          id: page_dial_sensitivity
          animation: MOVE_LEFT

  - id: close_dial_sensitivity
    then:
      - globals.set: {id: in_dial_sensitivity, value: 'false'}
      - script.execute: open_settings_menu

  - id: dial_sensitivity_up
    then:
      - lambda: |-
          int v = id(encoder_step_threshold) + 1;
          if (v > 10) v = 10;
          id(encoder_step_threshold) = v;
      - script.execute: refresh_dial_sensitivity

  - id: dial_sensitivity_down
    then:
      - lambda: |-
          int v = id(encoder_step_threshold) - 1;
          if (v < 1) v = 1;
          id(encoder_step_threshold) = v;
      - script.execute: refresh_dial_sensitivity

  - id: refresh_dial_sensitivity
    then:
      - lambda: |-
          static char buf[8];
          snprintf(buf, sizeof(buf), "%d", id(encoder_step_threshold));
          lv_label_set_text(id(lbl_dial_sensitivity_val), buf);
      - script.execute: refresh_settings_menu

  - id: open_menu_timeout
    then:
      - globals.set: {id: in_menu_timeout, value: 'true'}
      - globals.set: {id: menu_timeout_encoder_accum, value: '0'}
      - script.execute: refresh_menu_timeout
      - lvgl.page.show:
          id: page_menu_timeout
          animation: MOVE_LEFT

  - id: close_menu_timeout
    then:
      - globals.set: {id: in_menu_timeout, value: 'false'}
      - script.execute: open_settings_menu

  - id: menu_timeout_up
    then:
      - lambda: |-
          int v = id(menu_timeout_s) + 5;
          if (v > 300) v = 300;
          id(menu_timeout_s) = v;
      - script.execute: refresh_menu_timeout

  - id: menu_timeout_down
    then:
      - lambda: |-
          int v = id(menu_timeout_s) - 5;
          if (v < 5) v = 5;
          id(menu_timeout_s) = v;
      - script.execute: refresh_menu_timeout

  - id: refresh_menu_timeout
    then:
      - lambda: |-
          static char buf[8];
          snprintf(buf, sizeof(buf), "%d", id(menu_timeout_s));
          lv_label_set_text(id(lbl_menu_timeout_val), buf);
      - script.execute: refresh_settings_menu

  - id: open_buzzer_volume
    then:
      - globals.set: {id: in_buzzer_volume, value: 'true'}
      - script.execute: refresh_buzzer_volume
      - lvgl.page.show:
          id: page_buzzer_volume
          animation: MOVE_LEFT

  - id: close_buzzer_volume
    then:
      - globals.set: {id: in_buzzer_volume, value: 'false'}
      - script.execute: open_settings_menu

  - id: buzzer_volume_up
    then:
      - script.execute: toggle_buzzer_enabled

  - id: buzzer_volume_down
    then:
      - script.execute: toggle_buzzer_enabled

  - id: toggle_buzzer_enabled
    then:
      - lambda: |-
          id(buzzer_enabled) = !id(buzzer_enabled);
          if (id(buzzer_enabled)) {
            id(buzzer_rtttl).play("beep:d=16,o=6,b=200:c");
          } else {
            id(dismiss_timer_alarm).execute();
          }
      - script.execute: refresh_buzzer_volume

  - id: refresh_buzzer_volume
    then:
      - lambda: |-
          lv_label_set_text(id(lbl_buzzer_volume_val), id(buzzer_enabled) ? "ON" : "OFF");
          lv_obj_set_style_text_color(id(lbl_buzzer_volume_val),
            id(buzzer_enabled) ? lv_color_hex(0x4ADE80) : lv_color_hex(0x6B7280), LV_STATE_DEFAULT);
      - script.execute: refresh_settings_menu

  - id: open_motion_alert
    then:
      - globals.set: {id: in_motion_alert, value: 'true'}
      - globals.set: {id: motion_alert_field, value: '0'}
      - globals.set: {id: motion_alert_encoder_accum, value: '0'}
      - script.execute: refresh_motion_alert
      - lvgl.page.show:
          id: page_motion_alert
          animation: MOVE_LEFT

  - id: close_motion_alert
    then:
      - globals.set: {id: in_motion_alert, value: 'false'}
      - script.execute: open_settings_menu

  - id: motion_alert_next_field
    then:
      - globals.set: {id: motion_alert_encoder_accum, value: '0'}
      - lambda: 'id(motion_alert_field) = (id(motion_alert_field) + 1) % 3;'
      - script.execute: refresh_motion_alert

  - id: motion_alert_up
    then:
      - lambda: |-
          int f = id(motion_alert_field);
          if (f == 0) {
            id(motion_alert_enabled) = !id(motion_alert_enabled);
          } else if (f == 1) {
            int v = id(motion_alarm_duration_s) + 5;
            if (v > 120) v = 120;
            id(motion_alarm_duration_s) = v;
          } else {
            int v = id(motion_alarm_cooldown_s) + 5;
            if (v > 300) v = 300;
            id(motion_alarm_cooldown_s) = v;
          }
      - script.execute: refresh_motion_alert

  - id: motion_alert_down
    then:
      - lambda: |-
          int f = id(motion_alert_field);
          if (f == 0) {
            id(motion_alert_enabled) = !id(motion_alert_enabled);
          } else if (f == 1) {
            int v = id(motion_alarm_duration_s) - 5;
            if (v < 5) v = 5;
            id(motion_alarm_duration_s) = v;
          } else {
            int v = id(motion_alarm_cooldown_s) - 5;
            if (v < 0) v = 0;
            id(motion_alarm_cooldown_s) = v;
          }
      - script.execute: refresh_motion_alert

  - id: refresh_motion_alert
    then:
      - lambda: |-
          int f = id(motion_alert_field);
          const uint32_t focus_color = 0xFFFFFF;
          const uint32_t dim_color = 0x6B7280;

          static char buf_enabled[24];
          snprintf(buf_enabled, sizeof(buf_enabled), "Enabled: %s", id(motion_alert_enabled) ? "ON" : "OFF");
          lv_label_set_text(id(lbl_motion_row_enabled), buf_enabled);
          lv_obj_set_style_text_color(id(lbl_motion_row_enabled),
            lv_color_hex(f == 0 ? focus_color : dim_color), LV_STATE_DEFAULT);

          static char buf_duration[24];
          snprintf(buf_duration, sizeof(buf_duration), "Duration: %ds", id(motion_alarm_duration_s));
          lv_label_set_text(id(lbl_motion_row_duration), buf_duration);
          lv_obj_set_style_text_color(id(lbl_motion_row_duration),
            lv_color_hex(f == 1 ? focus_color : dim_color), LV_STATE_DEFAULT);

          static char buf_cooldown[24];
          snprintf(buf_cooldown, sizeof(buf_cooldown), "Cooldown: %ds", id(motion_alarm_cooldown_s));
          lv_label_set_text(id(lbl_motion_row_cooldown), buf_cooldown);
          lv_obj_set_style_text_color(id(lbl_motion_row_cooldown),
            lv_color_hex(f == 2 ? focus_color : dim_color), LV_STATE_DEFAULT);
      - script.execute: refresh_settings_menu

  - id: open_menu_items
    then:
      - globals.set: {id: in_menu_items, value: 'true'}
      - globals.set: {id: menu_items_field, value: '0'}
      - globals.set: {id: menu_items_encoder_accum, value: '0'}
      - script.execute: refresh_menu_items
      - lvgl.page.show:
          id: page_menu_items
          animation: MOVE_LEFT

  - id: close_menu_items
    then:
      - globals.set: {id: in_menu_items, value: 'false'}
      - script.execute: open_settings_menu

  - id: menu_items_next_field
    then:
      - globals.set: {id: menu_items_encoder_accum, value: '0'}
      - lambda: 'id(menu_items_field) = (id(menu_items_field) + 1) % 5;'
      - script.execute: refresh_menu_items

  # Either direction of the knob switches the focused item on or off. The
  # switch's on_turn_on/off redraws this page (menu_items_changed).
  - id: menu_items_toggle
    then:
      - lambda: |-
          switch_::Switch* SW[5] = {id(menu_show_timer), id(menu_show_lights), id(menu_show_radiators),
                                    id(menu_show_ac), id(menu_show_music)};
          SW[id(menu_items_field)]->toggle();

  - id: refresh_menu_items
    then:
      - lambda: |-
          const char* NAMES[5] = {"Timer", "Lights", "Radiators", "AC", "Music"};
          switch_::Switch* SW[5] = {id(menu_show_timer), id(menu_show_lights), id(menu_show_radiators),
                                    id(menu_show_ac), id(menu_show_music)};
          lv_obj_t* LBLS[5] = {id(lbl_menu_items_row_0), id(lbl_menu_items_row_1), id(lbl_menu_items_row_2),
                               id(lbl_menu_items_row_3), id(lbl_menu_items_row_4)};
          static char bufs[5][24];
          int f = id(menu_items_field);
          for (int i = 0; i < 5; i++) {
            snprintf(bufs[i], sizeof(bufs[i]), "%s: %s", NAMES[i], SW[i]->state ? "ON" : "OFF");
            lv_label_set_text(LBLS[i], bufs[i]);
            uint32_t c = (i == f) ? (SW[i]->state ? 0x4ADE80 : 0xFFFFFF) : 0x6B7280;
            lv_obj_set_style_text_color(LBLS[i], lv_color_hex(c), LV_STATE_DEFAULT);
          }

  - id: start_motion_alarm
    then:
      - globals.set: {id: motion_alarm_active, value: 'true'}
      - globals.set: {id: motion_alarm_blink, value: 'true'}
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - lambda: |-
          id(motion_alarm_start_ms) = millis();
          id(motion_alarm_last_trigger_ms) = millis();
          id(last_activity_ms) = millis();
          lv_obj_clear_flag(id(motion_alarm_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_fade_in(id(motion_alarm_overlay), 150, 0);
          if (!id(buzzer_rtttl).is_playing()) {
            id(buzzer_rtttl).play("alarm:d=8,o=6,b=200:c,c,p,c,c");
          }

  - id: stop_motion_alarm
    then:
      - globals.set: {id: motion_alarm_active, value: 'false'}
      - globals.set: {id: motion_alarm_blink, value: 'false'}
      - rtttl.stop:
          id: buzzer_rtttl
      - lambda: 'lv_obj_add_flag(id(motion_alarm_overlay), LV_OBJ_FLAG_HIDDEN);'

