# Copy this file to secrets.yaml and fill in your own values.
# Do not commit secrets.yaml.
# The names match Home Assistant's ESPHome secrets.yaml, where several devices
# share one file: wifi_* and ap_password are shared, dial_* are this device's.

wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# Password of the "M5Stack Dial Fallback" hotspot the Dial opens when Wi-Fi fails
ap_password: "YOUR_FALLBACK_AP_PASSWORD"

# Public dummy key for config checks only. Generate your own before flashing.
# It encrypts both the Home Assistant connection and OTA uploads.
dial_api_key: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="

# Webhook the Dial calls after a touch-wake so Home Assistant reconnects at
# once (packages/smart_home_dial.yaml; dial_wake_webhook in HA's secrets.yaml
# is the ID at the end).
dial_wake_url: "http://homeassistant.local:8123/api/webhook/your-random-webhook-id"
